<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모먼트플로우 견적서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { margin: 0; padding: 0; background: white; }
            #quotation-output { width: 100%; box-shadow: none; border: none; padding: 0; margin: 0; }
            input, textarea, select { border: none !important; background: transparent !important; appearance: none; }
            tr { page-break-inside: avoid; }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { font-family: 'Inter', sans-serif; }
        .item-card { transition: all 0.2s ease; cursor: grab; }
        .item-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card-actions { opacity: 0; transition: opacity 0.2s; }
        .item-card:hover .card-actions { opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        <div id="item-selection-panel" class="no-print lg:w-1/3 bg-white p-5 rounded-xl shadow-md h-full flex flex-col border border-gray-200">
            <h1 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">📦 항목 관리</h1>
            <div id="item-grid" class="flex-grow hide-scrollbar overflow-y-auto pr-1 pb-2 space-y-6" style="max-height: 600px;"></div>
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 shadow-inner mt-auto">
                <label class="block text-xs font-semibold text-gray-500 mb-3">➕ 새 항목 등록</label>
                <div class="flex flex-col gap-3">
                    <select id="new-item-category" class="w-full p-2 border border-gray-300 rounded text-sm bg-white"></select>
                    <input type="text" id="new-item-name" placeholder="항목명" class="w-full p-2 border border-gray-300 rounded text-sm">
                    <div class="flex gap-2">
                        <input type="number" id="new-item-price" placeholder="단가" class="w-2/3 p-2 border border-gray-300 rounded text-sm">
                        <button onclick="addNewCustomItem()" class="w-1/3 bg-gray-800 text-white text-xs font-bold rounded">등록</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:w-2/3 flex flex-col gap-4">
            <div id="quotation-output" class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 min-h-[800px] flex flex-col">
                <div class="flex justify-between items-end border-b-2 border-gray-800 pb-4 mb-8">
                    <div>
                        <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">견 적 서</h2>
                        <p class="text-sm text-gray-500 mt-1 font-medium">ESTIMATE SHEET</p>
                    </div>
                    <p class="text-sm text-gray-600">견적일자 <span id="issue-date"></span></p>
                </div>

                <div class="flex flex-col md:flex-row justify-between gap-4 mb-4">
                    <div class="w-full md:w-1/4">
                        <table class="w-full text-sm border-collapse border border-gray-300 h-full">
                            <tr>
                                <td class="bg-gray-100 border p-2 font-bold w-10 text-center align-middle">수<br>신</td>
                                <td class="border p-2 bg-white align-middle text-center">
                                    <input type="text" id="display-customer-name" value="고객사/담당자" class="font-bold text-xs w-full text-center border-b border-dashed border-gray-300"> 귀하
                                </td>
                            </tr>
                        </table>
                    </div>
                    <div class="w-full md:w-3/4 text-sm">
                        <table class="w-full border-collapse border border-gray-300">
                            <tr>
                                <td rowspan="4" class="bg-gray-100 border p-2 w-8 font-bold text-center align-middle">공<br>급<br>자</td>
                                <td class="bg-gray-50 border p-1 w-20 text-center font-bold text-xs">사업자번호</td>
                                <td colspan="3" class="border p-1 text-center bg-white"><input type="text" value="104-30-99627" class="w-full text-center"></td>
                            </tr>
                            <tr>
                                <td class="bg-gray-50 border p-1 text-center font-bold text-xs">상 호</td>
                                <td class="border p-1 text-center bg-white"><input type="text" value="모먼트플로우" class="w-full text-center"></td>
                                <td class="bg-gray-50 border p-1 w-14 text-center font-bold text-xs">대 표</td>
                                <td class="border p-1 text-center bg-white"><input type="text" value="엄성미" class="w-full text-center"></td>
                            </tr>
                            <tr>
                                <td class="bg-gray-50 border p-1 text-center font-bold text-xs">사업장주소</td>
                                <td colspan="3" class="border p-1 text-center bg-white text-xs"><input type="text" value="부산 연제구 토현로 10 망미주공아파트 103동 1004호" class="w-full text-center"></td>
                            </tr>
                            <tr>
                                <td class="bg-gray-50 border p-1 text-center font-bold text-xs">업 태</td>
                                <td class="border p-1 text-center bg-white text-xs"><input type="text" value="정보통신업" class="w-full text-center"></td>
                                <td class="bg-gray-50 border p-1 text-center font-bold text-xs">종 목</td>
                                <td class="border p-1 text-center bg-white text-xs"><input type="text" value="비디오물 제작업" class="w-full text-center"></td>
                            </tr>
                        </table>
                    </div>
                </div>

                <div class="mb-8">
                    <table class="w-full text-sm border-collapse border border-gray-300">
                        <tr>
                            <td class="bg-indigo-50 border p-3 font-bold text-center text-indigo-900 w-32 text-base">합 계 금 액</td>
                            <td class="border p-3 font-bold text-right pr-6 bg-white text-indigo-700 text-2xl" id="table-grand-total">0 원</td>
                        </tr>
                    </table>
                </div>

                <table class="w-full border-collapse border border-gray-400 text-sm mb-6">
                    <thead class="bg-gray-100">
                        <tr><th class="border border-gray-400 p-2 w-12 text-center">No</th><th class="border border-gray-400 p-2 text-center">품 명 / 항 목</th><th class="border border-gray-400 p-2 w-16 text-center">수 량</th><th class="border border-gray-400 p-2 w-28 text-center">단 가</th><th class="border border-gray-400 p-2 w-32 text-center">공급가액</th></tr>
                    </thead>
                    <tbody id="quote-items-body"></tbody>
                </table>
                <div class="mt-auto border-t-2 border-gray-800 pt-4 text-[10px] text-gray-500">
                    <p>• 견적 유효기간 : 견적일로부터 15일간 유효합니다.</p>
                    <p>• 결제 조건 : 착수금 50%, 잔금 50% (협의 가능)</p>
                </div>
            </div>

            <div class="no-print flex gap-2 justify-center py-4">
                <button onclick="hardReset()" class="px-5 py-2 border border-red-200 text-red-500 rounded-lg text-sm">🔄 초기화</button>
                <button onclick="window.print()" class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg shadow-md">인쇄 / 저장</button>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = ["기획", "디자인", "영상 편집", "모션그래픽", "음원 및 오디오", "추가옵션"];
        const DEFAULT_DATA = `기획,시나리오 기획,800000\n기획,시나리오 작성,200000\n디자인,"그래픽, 소스 라이선스",100000\n디자인,아이콘/일러스트 제작,200000\n디자인,캐릭터 제작,200000\n영상 편집,컷편집,800000\n영상 편집,기본자막,100000\n영상 편집,자막디자인,150000\n영상 편집,색보정/마감,300000\n모션그래픽,캐릭터 애니메이션,300000\n모션그래픽,텍스트 애니메이션,200000\n모션그래픽,아이콘/그래픽 모션,300000\n음원 및 오디오,BGM 라이선스,30000\n음원 및 오디오,SFX(효과음) 비용,20000\n음원 및 오디오,음원 믹싱,100000\n추가옵션,기본 썸네일 1종,70000\n추가옵션,고급 썸네일(합성/리터칭),120000\n추가옵션,숏폼 재편집(15/30/60초),100000\n추가옵션,그래픽 소스,200000`;

        let allItems = [], selectedItems = [];

        function init() {
            document.getElementById('issue-date').textContent = new Date().toLocaleDateString();
            document.getElementById('new-item-category').innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
            const stored = localStorage.getItem('mofl_master_items');
            allItems = stored ? JSON.parse(stored) : parseCsv(DEFAULT_DATA);
            render();
        }

        function parseCsv(csv) {
            return csv.trim().split('\n').map((l, i) => {
                const p = l.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                return { id: 'it-' + Date.now() + i, category: p[0].trim(), name: p[1].trim().replace(/"/g, ''), price: parseInt(p[2]) || 0 };
            });
        }

        function hardReset() { if(confirm("데이터를
