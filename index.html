<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모먼트플로우 견적서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { margin: 0; padding: 0; background: white; }
            #quotation-output { width: 100%; box-shadow: none; border: none; padding: 0; margin: 0; }
            input { border: none !important; background: transparent !important; appearance: none; }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { font-family: 'Inter', sans-serif; }
        .item-card { transition: all 0.2s ease; cursor: grab; }
        .item-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card-actions { opacity: 0; }
        .item-card:hover .card-actions { opacity: 1; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        <div class="no-print lg:w-1/3 bg-white p-5 rounded-xl shadow-md flex flex-col border border-gray-200">
            <h1 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">📦 항목 관리</h1>
            <div id="item-grid" class="flex-grow hide-scrollbar overflow-y-auto space-y-6" style="max-height: 600px;"></div>
            <div class="bg-gray-50 p-4 rounded-lg border mt-4">
                <label class="block text-xs font-semibold text-gray-500 mb-2">➕ 새 항목 등록</label>
                <div class="space-y-2">
                    <select id="new-item-category" class="w-full p-2 border rounded text-sm bg-white"></select>
                    <input type="text" id="new-item-name" placeholder="항목명" class="w-full p-2 border rounded text-sm">
                    <div class="flex gap-2">
                        <input type="number" id="new-item-price" placeholder="단가" class="w-2/3 p-2 border rounded text-sm">
                        <button onclick="addNewCustomItem()" class="w-1/3 bg-gray-800 text-white text-xs font-bold rounded">등록</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:w-2/3 flex flex-col gap-4">
            <div id="quotation-output" class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 min-h-[800px]">
                <div class="flex justify-between items-end border-b-2 border-gray-800 pb-4 mb-8">
                    <div>
                        <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">견 적 서</h2>
                        <p class="text-sm text-gray-500">ESTIMATE SHEET</p>
                    </div>
                    <p class="text-sm text-gray-600">견적일자 <span id="issue-date"></span></p>
                </div>
                
                <div class="flex flex-col md:flex-row justify-between gap-4 mb-4 text-sm">
                    <div class="w-full md:w-1/4">
                        <table class="w-full border-collapse border border-gray-300 h-full">
                            <tr>
                                <td class="bg-gray-100 p-2 font-bold w-10 text-center">수<br>신</td>
                                <td class="p-2 text-center align-middle"><input type="text" value="고객사" class="font-bold border-b border-dashed w-full text-center"> 귀하</td>
                            </tr>
                        </table>
                    </div>
                    <div class="w-full md:w-3/4">
                        <table class="w-full border-collapse border border-gray-300">
                            <tr>
                                <td rowspan="2" class="bg-gray-100 p-2 w-8 font-bold text-center">공급자</td>
                                <td class="bg-gray-50 p-1 font-bold text-center w-24 border">사업자번호</td>
                                <td class="p-1 text-center border font-bold">104-30-99627</td>
                            </tr>
                            <tr>
                                <td class="bg-gray-50 p-1 font-bold text-center border">상 호</td>
                                <td class="p-1 text-center border">모먼트플로우</td>
                            </tr>
                        </table>
                    </div>
                </div>

                <div class="mb-8">
                    <table class="w-full border border-gray-300">
                        <tr class="text-xl font-bold">
                            <td class="bg-indigo-50 p-3 text-center w-32 text-indigo-900">합계금액</td>
                            <td class="p-3 text-right pr-6 text-indigo-700 text-2xl" id="grand-total">0 원</td>
                        </tr>
                    </table>
                </div>

                <table class="w-full border-collapse border border-gray-400 text-sm mb-6">
                    <thead class="bg-gray-100">
                        <tr><th class="border border-gray-400 p-2">No</th><th class="border border-gray-400 p-2">품 명 / 항 목</th><th class="border border-gray-400 p-2">수 량</th><th class="border border-gray-400 p-2">단 가</th><th class="border border-gray-400 p-2">공급가액</th></tr>
                    </thead>
                    <tbody id="quote-items-body"></tbody>
                </table>
            </div>

            <div class="no-print flex gap-2 justify-center py-4">
                <button onclick="hardReset()" class="px-5 py-2 border border-red-200 text-red-500 rounded-lg text-sm">🔄 초기화</button>
                <button onclick="window.print()" class="px-6 py-2 bg-indigo-600 text-white font-bold rounded-lg shadow-md">
