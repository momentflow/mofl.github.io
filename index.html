<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모먼트플로우 견적서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { margin: 0; padding: 0; background: white; }
            #quotation-output { width: 100%; box-shadow: none; border: none; padding: 0; margin: 0; }
            input, textarea, select { border: none !important; appearance: none; }
            tr { page-break-inside: avoid; }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { font-family: 'Inter', sans-serif; }
        .item-card { transition: all 0.2s ease; cursor: grab; }
        .item-card:active { cursor: grabbing; }
        .item-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .sortable-ghost { opacity: 0.4; background-color: #e0e7ff; border: 2px dashed #a5b4fc; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8">
    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        <div id="item-selection-panel" class="no-print lg:w-1/3 bg-white p-5 rounded-xl shadow-md h-full flex flex-col border border-gray-200">
            <h1 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-100">📦 항목 관리</h1>
            <div class="flex-grow overflow-hidden flex flex-col mb-4">
                <div id="item-grid" class="flex-grow hide-scrollbar overflow-y-auto pr-1 pb-2 space-y-6" style="max-height: 600px;">
                    </div>
            </div>
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 shadow-inner mt-auto">
                <label class="block text-xs font-semibold text-gray-500 mb-3">➕ 새 항목 등록</label>
                <div class="flex flex-col gap-3">
                    <select id="new-item-category" class="w-full p-2 border border-gray-300 rounded text-sm bg-white"></select>
                    <input type="text" id="new-item-name" placeholder="항목명" class="w-full p-2 border border-gray-300 rounded text-sm">
                    <div class="flex gap-2">
                        <input type="number" id="new-item-price" placeholder="단가" class="w-2/3 p-2 border border-gray-300 rounded text-sm">
                        <button onclick="addNewCustomItem()" class="w-1/3 bg-gray-800 text-white text-xs font-bold rounded">등록</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:w-2/3 flex flex-col gap-4">
            <div id="quotation-output" class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 min-h-[800px]">
                <div class="flex justify-between items-end border-b-2 border-gray-800 pb-4 mb-8">
                    <div>
                        <h2 class="text-4xl font-extrabold text-gray-900">견 적 서</h2>
                        <p class="text-sm text-gray-500 mt-1">ESTIMATE SHEET</p>
                    </div>
                    <p class="text-sm text-gray-600">견적일자: <span id="issue-date"></span></p>
                </div>

                <div class="mb-8">
                    <table class="w-full text-sm border border-gray-300">
                        <tr>
                            <td class="bg-indigo-50 border p-3 font-bold text-center w-32">합 계 금 액</td>
                            <td class="border p-3 font-bold text-right text-indigo-700 text-2xl" id="table-grand-total">0 원</td>
                        </tr>
                    </table>
                </div>

                <table class="w-full border-collapse border border-gray-400 text-sm">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="border border-gray-400 p-2 w-12">No</th>
                            <th class="border border-gray-400 p-2">품 명 / 항 목</th>
                            <th class="border border-gray-400 p-2 w-16">수 량</th>
                            <th class="border border-gray-400 p-2 w-28">단 가</th>
                            <th class="border border-gray-400 p-2 w-28">공급가액</th>
                        </tr>
                    </thead>
                    <tbody id="quote-items-body"></tbody>
                </table>
                
                <div class="no-print mt-
