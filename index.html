<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모먼트플로우 견적서</title>
    <!-- Tailwind CSS CDN 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SortableJS CDN 로드 (드래그 앤 드롭 기능 추가) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <style>
        /* 인쇄 시 불필요한 요소 숨기기 */
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                margin: 0;
                padding: 0;
                background: white;
            }
            #quotation-output {
                width: 100%;
                box-shadow: none;
                border: none;
                padding: 0;
                margin: 0;
            }
            input, textarea, select {
                border: none !important;
                background: transparent !important;
                resize: none;
                padding: 0;
                margin: 0;
                box-shadow: none !important;
                appearance: none;
            }
            input[type="number"] {
                appearance: none;
                -moz-appearance: textfield;
                text-align: right;
            }
            input[type="number"]::-webkit-outer-spin-button,
            input[type="number"]::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            tr { page-break-inside: avoid; }
        }

        /* 스크롤바 숨기기 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }

        /* 견적 항목 카드 인터랙션 */
        .item-card {
            transition: all 0.2s ease;
            cursor: grab;
        }
        .item-card:active {
            cursor: grabbing;
        }
        .item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .item-card:hover .card-actions {
            opacity: 1;
        }
        /* SortableJS ghost class */
        .sortable-ghost {
            opacity: 0.4;
            background-color: #e0e7ff;
            border: 2px dashed #a5b4fc;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">

        <!-- 왼쪽: 견적 항목 관리 패널 -->
        <div id="item-selection-panel" class="no-print lg:w-1/3 bg-white p-5 rounded-xl shadow-md h-full flex flex-col border border-gray-200">
            <h1 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b border-gray-100 flex justify-between items-center">
                <span>📦 항목 관리</span>        
                </h1>

            
            <!-- 항목 리스트 (카테고리별 그룹화) -->
            <div class="flex-grow overflow-hidden flex flex-col mb-4">
                 
                <div id="item-grid" class="flex-grow hide-scrollbar overflow-y-auto pr-1 pb-2 space-y-6" style="max-height: 500px;">
                    <!-- 항목이 여기에 렌더링됩니다 -->
                    <div id="loading-indicator" class="text-center p-8 text-gray-500 hidden">
                        <!-- 초기 로드 후 숨김 -->
                        <svg class="animate-spin h-5 w-5 mr-3 inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        항목 로딩 중...
                    </div>
                </div>
            </div>

            <!-- 직접 입력 폼 (대분류 추가) -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 shadow-inner mt-auto">
                <label class="block text-xs font-semibold text-gray-500 mb-3">➕ 새 항목 등록</label>
                <div class="flex flex-col gap-3">
                    <!-- 대분류 선택 -->
                    <div>
                        <select id="new-item-category" class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-indigo-500 bg-white">
                            <option value="" disabled selected>대분류 선택</option>
                            <option value="기획">기획</option>
                            <option value="디자인">디자인</option>
                            <option value="편집">편집</option>
                            <option value="모션그래픽">모션그래픽</option>
                            <option value="음원 및 오디오">음원 및 오디오</option>
                            <option value="추가옵션">추가옵션</option>
                        </select>
                    </div>

                    <input type="text" id="new-item-name" placeholder="항목명 (예: 상세 기획안)" class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-indigo-500">
                    
                    <div class="flex gap-2">
                        <input type="number" id="new-item-price" placeholder="단가 (원)" class="w-2/3 p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-indigo-500">
                        <button onclick="addNewCustomItem()" class="w-1/3 bg-gray-800 hover:bg-gray-900 text-white text-xs font-bold rounded transition shadow-sm">
                            등록
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 오른쪽: 견적서 작성 및 미리보기 -->
        <div class="lg:w-2/3 flex flex-col gap-4">
            
            <!-- 견적서 본문 -->
            <div id="quotation-output" class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 min-h-[800px] flex flex-col">
                <div id="print-area" class="flex-grow flex flex-col justify-between h-full">
                    
                    <!-- 상단 헤더 -->
                    <div>
                        <div class="flex justify-between items-end border-b-2 border-gray-800 pb-4 mb-8">
                            <div>
                                <h2 class="text-4xl font-extrabold text-gray-900 tracking-tight">견 적 서</h2>
                                <p class="text-sm text-gray-500 mt-1 font-medium">ESTIMATE SHEET</p>
                            </div>
                            <div class="text-right">
                                                                <p class="text-sm text-gray-600">견적일자 <span id="issue-date"></span></p>
                            </div>
                        </div>

                        <!-- 공급받는자 / 공급자 정보 -->
                        <div class="flex flex-col md:flex-row justify-between gap-4 mb-4">
                            
                            <!-- 수신 (왼쪽: 좁게 w-1/3) -->
                            <div class="w-full md:w-1/4 flex flex-col">
                                <table class="w-full text-sm border-collapse border border-gray-300 shadow-sm h-full">
                                    <tr class="h-full">
                                        <td class="bg-gray-100 border border-gray-300 p-2 font-bold w-10 text-center align-middle">수<br>신</td> <td class="border border-gray-300 p-2 bg-white align-middle">
                                            <div class="flex items-center h-full">
                                                <input type="text" id="display-customer-name" value="고객사/담당자" class="font-bold text-gray-800 text-xs w-full bg-transparent focus:outline-none border-b border-dashed border-gray-300 focus:border-indigo-500 placeholder-gray-400 text-center" placeholder="이름 입력"> <span class="ml-1 whitespace-nowrap">귀하</span>
                                            </div>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                            
                            <!-- 공급자 (오른쪽: 넓게 w-2/3) -->
                            <div class="w-full md:w-3/4 text-sm">
                                <table class="w-full border-collapse border border-gray-300 shadow-sm h-full">
                                    <tr>
                                        <td rowspan="4" class="bg-gray-100 border border-gray-300 p-2 w-8 font-bold text-center writing-vertical align-middle">공<br>급<br>자</td>
                                        <td class="bg-gray-50 border border-gray-300 p-1 w-20 text-center font-bold text-xs align-middle">사업자번호</td>
                                        <td colspan="3" class="border border-gray-300 p-1 text-center bg-white align-middle">
                                            <input type="text" value="104-30-99627" class="w-full text-center bg-transparent focus:outline-none" placeholder="사업자번호 입력">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="bg-gray-50 border border-gray-300 p-1 text-center font-bold text-xs align-middle">상 호</td>
                                        <td class="border border-gray-300 p-1 text-center bg-white align-middle">
                                            <input type="text" value="모먼트플로우" class="w-full text-center bg-transparent focus:outline-none" placeholder="상호명">
                                        </td>
                                        <td class="bg-gray-50 border border-gray-300 p-1 w-14 text-center font-bold text-xs align-middle">대 표</td>
                                        <td class="border border-gray-300 p-1 text-center bg-white align-middle">
                                            <input type="text" value="엄성미" class="w-full text-center bg-transparent focus:outline-none" placeholder="대표자명">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="bg-gray-50 border border-gray-300 p-1 text-center font-bold text-xs align-middle">사업장주소</td>
                                        <td colspan="3" class="border border-gray-300 p-1 text-center bg-white text-xs align-middle">
                                            <input type="text" value="부산 연제구 토현로 10 망미주공아파트 103동 1004호" class="w-full text-center bg-transparent focus:outline-none" placeholder="주소를 입력하세요">
                                        </td>
                                    </tr>
                                    <tr>
                                        <td class="bg-gray-50 border border-gray-300 p-1 text-center font-bold text-xs align-middle">업 태</td>
                                        <td class="border border-gray-300 p-1 text-center bg-white text-xs align-middle">
                                            <input type="text" value="정보통신업" class="w-full text-center bg-transparent focus:outline-none" placeholder="업태">
                                        </td>
                                        <td class="bg-gray-50 border border-gray-300 p-1 text-center font-bold text-xs align-middle">종 목</td>
                                        <td class="border border-gray-300 p-1 text-center bg-white text-xs align-align-middle">
                                            <input type="text" value="애니메이션 영화 및 비디오물 제작업" class="w-full text-center bg-transparent focus:outline-none" placeholder="종목">
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <!-- 합계 칸 -->
                        <div class="mb-8">
                            <table class="w-full text-sm border-collapse border border-gray-300 shadow-sm">
                                <tr>
                                    <td class="bg-indigo-50 border border-gray-300 p-3 font-bold text-center text-indigo-900 w-32 text-base">합 계 금 액</td>
                                    <td class="border border-gray-300 p-3 font-bold text-right pr-6 bg-white text-indigo-700 text-2xl" id="table-grand-total">0 원</td>
                                </tr>
                            </table>
                        </div>

                        <p class="text-sm mb-2 text-gray-600 font-medium">아래와 같이 견적합니다.</p>

                        <!-- 상세 테이블 -->
                        <div class="w-full mb-6">
                            <table class="w-full border-collapse border border-gray-400 text-sm">
                                <thead class="bg-gray-100 text-gray-700">
                                    <tr>
                                        <th class="border border-gray-400 p-2 w-12 text-center">No</th>
                                        <th class="border border-gray-400 p-2 text-center">품 명 / 항 목</th>
                                        <th class="border border-gray-400 p-2 w-16 text-center">수 량</th>
                                        <th class="border border-gray-400 p-2 w-28 text-center">단 가</th>
                                        <th class="border border-gray-400 p-2 w-28 text-center">공급가액</th>
                                        <th class="border border-gray-400 p-2 w-24 text-center">세 액</th>
                                    </tr>
                                </thead>
                                <tbody id="quote-items-body" class="text-gray-800">
                                    <!-- 자바스크립트로 렌더링 -->
                                </tbody>
                                <tfoot class="bg-gray-50 font-bold text-gray-800">
                                    <tr>
                                        <td colspan="4" class="border border-gray-400 p-2 text-center bg-gray-100">합 계 (VAT 별도)</td>
                                        <td class="border border-gray-400 p-2 text-right pr-3 text-indigo-900" id="sub-total">0</td>
                                        <td class="border border-gray-400 p-2 text-right pr-3 text-gray-600" id="vat-amount">0</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    <button onclick="clearQuote()" class="bg-white hover:bg-red-50 text-red-500 hover:text-red-600 font-semibold py-2.5 px-5 rounded-lg transition duration-150 border border-red-200 text-sm flex items-center gap-2 shadow-sm">
                        <span>🔄 초기화</span>
                    </button>
                    <button onclick="printQuote()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-lg transition duration-150 shadow-md flex items-center gap-2 text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                        </svg>
                        <span>인쇄 / 저장</span>
                    </button>
                </div>
            </div>

        </div>
    </div>
    
    <!-- Custom Modal Structure (for prompt/confirm replacement) -->
    <div id="custom-modal-backdrop" class="fixed inset-0 bg-gray-900 bg-opacity-75 hidden z-50 items-center justify-center transition-opacity duration-300">
        <div id="custom-modal-content" class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full transform transition-transform duration-300 scale-95">
            <!-- Content will be injected here -->
        </div>
    </div>


    <script>
        
        // === 고객님이 제공한 CSV 데이터 ===
        // CSV 파일 내용: "estimate sheet.xlsx - Estimate.csv"
        const csvData = `,영상 단가표,
대분류,세부 항목,단가(원)
기획,시나리오 기획,800000
기획,내레이션 원고 작성,200000
디자인,"그래픽, 영상 소스 라이선스",100000
디자인,아이콘/일러스트 제작,200000
디자인,캐릭터 제작,200000
영상 편집,컷편집,800000
영상 편집,기본자막,100000
영상 편집,자막디자인,150000
영상 편집,색보정/마감,300000
모션그래픽,캐릭터 애니메이션,300000
모션그래픽,텍스트 애니메이션,200000
모션그래픽,아이콘/그래픽 모션,300000
음원·오디오,BGM 라이선스,30000
음원·오디오,SFX(효과음) 비용,20000
음원·오디오,음원 믹싱,100000
추가 옵션,기본 썸네일 1종,70000
추가 옵션,고급 썸네일(합성/리터칭),120000
추가 옵션,숏폼 재편집(15/30/60초),100000
추가 옵션,그래픽 소스,200000
`;

        // === 데이터 관리 및 초기 상태 ===
        
        // 카테고리 목록 정의: 이 목록에 맞춰 CSV 데이터가 통합됩니다.
        const CATEGORIES = [
            "기획", 
            "디자인", 
            "영상촬영물", // '영상 촬영물' 통합
            "모션그래픽", 
            "음원 및 오디오", // '음원·오디오' 통합
            "추가옵션" // '추가 옵션' 통합
        ];

        // CSV 카테고리 명칭과 통합될 목표 명칭 매핑
        const CATEGORY_MAP = {
            "영상 촬영물": "영상촬영물",
            "음원·오디오": "음원 및 오디오",
            "추가 옵션": "추가옵션",
        };


        /**
         * CSV 데이터를 파싱하여 항목 객체 배열로 변환합니다.
         * 이 함수 내에서 CSV 항목 명칭을 목표 명칭으로 통합합니다.
         * @returns {Array<Object>} 항목 데이터 배열
         */
        const parseCsvData = () => {
            const lines = csvData.trim().split('\n');
            if (lines.length < 3) return []; // 최소한 헤더와 한 줄의 데이터가 있어야 함

            // 세 번째 줄부터 데이터 시작
            const dataLines = lines.slice(3); 
            const items = [];
            
            let idCounter = 1;

            dataLines.forEach((line) => {
                const parts = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
                
                if (parts.length >= 3) {
                    let category = parts[0].trim();
                    
                    // 대분류 통합 로직: CSV 명칭을 목표 명칭으로 변경
                    if (CATEGORY_MAP[category]) {
                        category = CATEGORY_MAP[category];
                    }
                    
                    // 따옴표 제거 (예: "그래픽, 영상 소스 라이선스" -> 그래픽, 영상 소스 라이선스)
                    const name = parts[1].trim().replace(/^"(.*)"$/, '$1'); 
                    const priceString = parts[2].trim().replace(/,/g, ''); // 쉼표 제거
                    const price = parseInt(priceString) || 0; // 숫자로 변환, 실패 시 0

                    if (category && name) {
                        items.push({
                            id: `csv-${idCounter++}`, 
                            category: category,
                            name: name,
                            price: price,
                            order: idCounter, 
                        });
                    }
                }
            });

            return items;
        };
        
        
        // localStorage에서 로드될 항목 목록
        let allItems = []; 
        let selectedItems = []; // 견적서에 추가된 항목 (세션 유지)
        
        
        // === DOM 요소 ===
        const itemGrid = document.getElementById('item-grid');
        const loadingIndicator = document.getElementById('loading-indicator');
        const quoteItemsBody = document.getElementById('quote-items-body');
        const subTotalElement = document.getElementById('sub-total');
        const vatAmountElement = document.getElementById('vat-amount');
        const tableGrandTotalElement = document.getElementById('table-grand-total');
        const displayCustomerName = document.getElementById('display-customer-name');
        
        // 입력 폼 요소
        const newItemCategoryInput = document.getElementById('new-item-category');
        const newItemNameInput = document.getElementById('new-item-name');
        const newItemPriceInput = document.getElementById('new-item-price');

        // 모달 요소
        const modalBackdrop = document.getElementById('custom-modal-backdrop');
        const modalContent = document.getElementById('custom-modal-content');

        
        // === LocalStorage 데이터 관리 ===

        const LOCAL_STORAGE_KEY = 'masterQuotationItems';

        /**
         * 로컬 저장소에서 항목 목록을 불러옵니다.
         */
        const loadMasterItemsFromLocal = () => {
            try {
                const storedItems = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (storedItems) {
                    allItems = JSON.parse(storedItems);
                    // order 필드를 기준으로 정렬 (숫자 오름차순)
                    allItems.sort((a, b) => {
                        const categoryAIndex = CATEGORIES.indexOf(a.category);
                        const categoryBIndex = CATEGORIES.indexOf(b.category);
                        if (categoryAIndex !== categoryBIndex) {
                            return categoryAIndex - categoryBIndex;
                        }
                        return a.order - b.order;
                    });
                } else {
                    // 저장된 데이터가 없으면 CSV 데이터로 초기화
                    allItems = parseCsvData();
                    saveMasterItemsToLocal(); 
                }
            } catch (error) {
                console.error("Error loading items from localStorage:", error);
                // 오류 발생 시 CSV 데이터로 강제 초기화
                allItems = parseCsvData(); 
            }
        };

        /**
         * 현재 항목 목록을 로컬 저장소에 저장합니다.
         */
        const saveMasterItemsToLocal = () => {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(allItems));
            } catch (error) {
                console.error("Error saving items to localStorage:", error);
                // 사용자에게 저장 실패를 알리는 모달 등을 표시할 수 있습니다.
            }
        };

        // selectedItems의 데이터를 master list (allItems)의 최신 데이터로 업데이트합니다.
        const updateSelectedItemsFromMaster = () => {
            selectedItems = selectedItems.map(sItem => {
                // sItem의 sourceId는 master item의 id입니다.
                const masterItem = allItems.find(mItem => mItem.id === sItem.sourceId);
                if (masterItem) {
                    // 이름, 단가, 카테고리를 마스터 데이터로 동기화
                    return {
                        ...sItem,
                        category: masterItem.category,
                        name: masterItem.name,
                        price: masterItem.price,
                    };
                }
                // 마스터에서 삭제된 항목은 견적서에서도 제거합니다.
                return null;
            }).filter(item => item !== null);
        };

        
        // === 커스텀 모달 로직 ===
        
        const showCustomConfirm = (message, onConfirm) => {
            modalContent.innerHTML = `
                <p class="text-lg font-semibold mb-6 text-gray-800">${message}</p>
                <div class="flex justify-end gap-3">
                    <button id="modal-cancel" class="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-150 font-medium">취소</button>
                    <button id="modal-confirm" class="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition duration-150 font-medium">확인</button>
                </div>
            `;
            modalBackdrop.classList.remove('hidden');
            modalBackdrop.classList.add('flex');

            document.getElementById('modal-confirm').onclick = () => {
                modalBackdrop.classList.add('hidden');
                modalBackdrop.classList.remove('flex');
                onConfirm(true);
            };
            document.getElementById('modal-cancel').onclick = () => {
                modalBackdrop.classList.add('hidden');
                modalBackdrop.classList.remove('flex');
                onConfirm(false);
            };
        };

        const showMasterItemEditModal = (title, currentName, currentPrice, onAccept) => {
            modalContent.innerHTML = `
                <p class="text-xl font-bold mb-4 text-gray-800">${title}</p>
                <div class="space-y-4">
                    <label class="block">
                        <span class="text-sm font-medium text-gray-700">항목명</span>
                        <input id="modal-input-name" type="text" value="${currentName.replace(/"/g, '&quot;')}" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-base" placeholder="항목명을 입력하세요">
                    </label>
                    <label class="block">
                        <span class="text-sm font-medium text-gray-700">단가 (원)</span>
                        <input id="modal-input-price" type="number" value="${currentPrice}" min="0" class="mt-1 w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-base text-right" placeholder="단가를 입력하세요">
                    </label>
                </div>
                <div id="modal-error" class="text-red-500 text-sm mt-3 hidden"></div>
                <div class="flex justify-end gap-3 mt-6">
                    <button id="modal-cancel" class="px-5 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition duration-150 font-medium">취소</button>
                    <button id="modal-accept" class="px-5 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition duration-150 font-medium">저장</button>
                </div>
            `;
            modalBackdrop.classList.remove('hidden');
            modalBackdrop.classList.add('flex');
            
            const inputName = document.getElementById('modal-input-name');
            const inputPrice = document.getElementById('modal-input-price');
            const errorElement = document.getElementById('modal-error');

            inputName.select();
            inputName.focus();

            const handleAccept = () => {
                const newName = inputName.value.trim();
                const newPrice = parseInt(inputPrice.value);

                if (!newName) {
                    errorElement.textContent = "항목 이름은 비어있을 수 없습니다.";
                    errorElement.classList.remove('hidden');
                    return;
                }
                if (isNaN(newPrice) || newPrice < 0) {
                    errorElement.textContent = "단가는 0 이상의 숫자여야 합니다.";
                    errorElement.classList.remove('hidden');
                    return;
                }
                
                errorElement.classList.add('hidden');
                modalBackdrop.classList.add('hidden');
                modalBackdrop.classList.remove('flex');

                onAccept({ name: newName, price: newPrice });
            };

            document.getElementById('modal-accept').onclick = handleAccept;
            
            document.getElementById('modal-cancel').onclick = () => {
                modalBackdrop.classList.add('hidden');
                modalBackdrop.classList.remove('flex');
                onAccept(null);
            };

            inputName.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    inputPrice.focus();
                }
            });
            inputPrice.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleAccept();
                }
            });
        };

        // 유틸리티: 숫자 포맷
        const formatNumber = (num) => num.toLocaleString('ko-KR');

        // 초기 설정 (날짜, 번호)
const initMetaInfo = () => {
    const today = new Date();
    const dateStr = `${today.getFullYear()}. ${(today.getMonth()+1).toString().padStart(2,'0')}. ${today.getDate().toString().padStart(2,'0')}`;
    document.getElementById('issue-date').textContent = dateStr;
    // 견적번호 설정 로직이 삭제되었습니다.
};


        // === 드래그 앤 드롭 및 데이터 업데이트 로직 (Local Storage) ===

        /**
         * SortableJS를 사용하여 드래그 후 항목 데이터 순서를 로컬 저장소에 업데이트합니다.
         */
        const updateAllItemsOrder = () => {
            // DOM 구조를 순회하며 모든 카테고리의 순서를 업데이트합니다.
            CATEGORIES.forEach(category => {
                const container = document.getElementById(`category-grid-${category.replace(/\s/g, '-')}`);
                if (!container) return;
                
                // DOM에서 새로운 순서의 item id 목록을 가져옵니다.
                const newOrderId = Array.from(container.children)
                                      .map(el => el.dataset.itemId)
                                      .filter(id => id);

                let newOrder = 1;
                newOrderId.forEach(itemId => {
                    const item = allItems.find(i => i.id === itemId);
                    if (item) {
                        item.order = newOrder++;
                    }
                });
            });

            // 모든 순서 업데이트 후 저장
            saveMasterItemsToLocal();
            // 재정렬된 상태를 반영하기 위해 다시 로드하고 렌더링합니다.
            loadMasterItemsFromLocal();
            renderItemCards();
        };


        /**
         * SortableJS를 초기화하여 항목을 드래그 가능하게 만듭니다.
         */
        const initSortable = () => {
            const containers = document.querySelectorAll('.category-sortable-container');
            
            containers.forEach(container => {
                // 이전에 초기화된 Sortable 인스턴스가 있다면 제거
                if (container.sortable) {
                    container.sortable.destroy();
                }

                container.sortable = new Sortable(container, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    handle: '.item-card',
                    group: 'category-items',
                    
                    onEnd: function (evt) {
                        // DOM 순서가 변경되었을 때, underlying data(Local Storage)도 업데이트
                        updateAllItemsOrder();
                    }
                });
            });
        };


        // === 왼쪽 패널: 아이템 목록 렌더링 ===
        const renderItemCards = () => {
            itemGrid.innerHTML = '';
            
            if (allItems.length === 0) {
                 const placeholder = document.createElement('div');
                 placeholder.className = "text-center p-8 text-gray-500 italic";
                 placeholder.textContent = "저장된 항목이 없습니다. 새로운 항목을 추가해보세요!";
                 itemGrid.appendChild(placeholder);
                 return;
            }

            // 카테고리 순서대로 렌더링
            CATEGORIES.forEach(category => {
                // 유효성 검사를 추가하여 category 속성이 있는 항목만 필터링합니다.
                // loadMasterItemsFromLocal에서 order 기준으로 정렬되었으므로 별도 정렬은 필요 없습니다.
                const itemsInCategory = allItems.filter(item => item && item.category === category);
                
                if (itemsInCategory.length > 0) {
                    const section = document.createElement('div');
                    section.className = 'mb-2';
                    
                    const header = document.createElement('h3');
                    header.className = 'text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-md inline-block mb-2 border border-indigo-100';
                    header.textContent = category;
                    section.appendChild(header);

                    const grid = document.createElement('div');
                    grid.id = `category-grid-${category.replace(/\s/g, '-')}`;
                    grid.className = 'grid grid-cols-1 gap-2 category-sortable-container'; 

                    itemsInCategory.forEach(item => {
                        const card = document.createElement('div');
                        // id를 데이터 속성에 저장
                        card.dataset.itemId = item.id; 
                        card.className = 'item-card group bg-white p-3 border border-gray-200 rounded-lg shadow-sm hover:shadow-md relative cursor-pointer flex justify-between items-center';
                        
                        // 카드 클릭 이벤트
                        card.onclick = (e) => {
                            // 버튼 클릭을 제외하고 항목 추가
                            if (e.target.closest('button')) {
                                return;
                            }
                            addItemToQuote(item);
                        };

                        card.innerHTML = `
                            <div>
                                <p class="text-sm font-semibold text-gray-700">${item.name}</p>
                                <p class="text-xs text-gray-500 mt-0.5">${formatNumber(item.price)}원</p>
                            </div>
                            
                            <div class="card-actions flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                                <button onclick="editMasterItem('${item.id}', event)" class="p-2 bg-gray-100 hover:bg-blue-100 text-blue-600 rounded text-xs" title="수정">✏️</button>
                                <button onclick="deleteMasterItem('${item.id}', event)" class="p-2 bg-gray-100 hover:bg-red-100 text-red-500 rounded text-xs" title="삭제">🗑️</button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                    itemGrid.appendChild(section);
                }
            });
            initSortable(); // 항목 목록을 렌더링한 후 SortableJS를 재초기화합니다.
        };

        // [왼쪽 패널] 새 항목 추가 (Local Storage)
        window.addNewCustomItem = () => {
            const category = newItemCategoryInput.value;
            const name = newItemNameInput.value.trim();
            const price = parseInt(newItemPriceInput.value.replace(/,/g, ''));

            if (!category) return console.error("오류: 대분류를 선택해주세요.");
            if (!name) return console.error("오류: 항목 이름을 입력해주세요.");
            if (isNaN(price) || price < 0) return console.error("오류: 유효한 가격을 입력해주세요.");
            
            // 현재 존재하는 가장 큰 order 값 + 1을 새 항목의 order 값으로 사용
            const maxOrder = allItems.reduce((max, item) => Math.max(max, item.order || 0), 0);
            const newOrder = maxOrder + 1;

            const newItemData = { 
                id: crypto.randomUUID(), // 고유 ID 생성
                category: category,
                name: name, 
                price: price,
                order: newOrder,
            };
            
            allItems.push(newItemData);
            saveMasterItemsToLocal();
            loadMasterItemsFromLocal(); // 정렬 후 로드
            renderItemCards();
            
            // 입력 폼 초기화
            newItemNameInput.value = '';
            newItemPriceInput.value = '';
            newItemCategoryInput.value = ''; // 선택 초기화
            newItemNameInput.focus();
        };

        // [왼쪽 패널] 항목 삭제 (Local Storage)
        window.deleteMasterItem = (id, event) => {
            if (event) event.stopPropagation();

            showCustomConfirm("목록에서 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다. 견적서에서도 제거됩니다.", (isConfirmed) => {
                if (isConfirmed) {
                    allItems = allItems.filter(item => item.id !== id);
                    saveMasterItemsToLocal();
                    
                    // 삭제된 항목이 견적서에 있으면 제거하고 견적서도 갱신
                    updateSelectedItemsFromMaster(); 
                    renderItemCards();
                    renderQuote();
                }
            });
        };

        // [왼쪽 패널] 항목 수정 (Local Storage)
        window.editMasterItem = (id, event) => {
            if (event) event.stopPropagation();

            const itemIndex = allItems.findIndex(i => i.id === id);
            if (itemIndex === -1) return;
            const item = allItems[itemIndex];

            showMasterItemEditModal("항목 수정:", item.name, item.price, (result) => {
                if (result) {
                    allItems[itemIndex].name = result.name;
                    allItems[itemIndex].price = result.price;
                    saveMasterItemsToLocal();

                    // 마스터 데이터 업데이트 후 견적서 동기화 및 렌더링
                    updateSelectedItemsFromMaster(); 
                    renderItemCards();
                    renderQuote(); 
                }
            });
        };


        // === 오른쪽 패널: 견적서 로직 ===

        const addItemToQuote = (item) => {
            // 견적서에 추가된 항목은 마스터 아이템의 최신 정보를 반영하되, 
            // 수량(count)이나 견적서 내에서 수정된 이름/단가는 유지해야 합니다.
            
            // 이미 추가된 항목인지 확인 (sourceId는 마스터 아이템의 ID)
            const existing = selectedItems.find(i => i.sourceId === item.id);
            if (existing) {
                // 이미 존재하면 수량만 증가
                existing.count++;
            } else {
                // 새로 추가할 때는 마스터 항목 정보를 복사
                selectedItems.push({
                    sourceId: item.id, 
                    category: item.category,
                    name: item.name,
                    price: item.price,
                    count: 1
                });
            }
            renderQuote();
        };

        window.removeQuoteItem = (index) => {
            selectedItems.splice(index, 1);
            renderQuote();
        };

        window.updateQuoteItem = (index, field, value) => {
            if (!selectedItems[index]) return;
            
            if (field === 'count') {
                const val = parseInt(value);
                if (val < 1 || isNaN(val)) {
                    // 유효하지 않은 값 입력 시 1로 강제 설정
                    selectedItems[index].count = 1;
                } else {
                    selectedItems[index].count = val;
                }
            } else if (field === 'price') {
                const val = parseInt(value);
                if (isNaN(val) || val < 0) {
                     // 유효하지 않은 값 입력 시 0으로 강제 설정
                    selectedItems[index].price = 0;
                } else {
                    selectedItems[index].price = val;
                }
            } else if (field === 'name') {
                selectedItems[index].name = value;
            }
            renderQuote();
        };

        const renderQuote = () => {
            quoteItemsBody.innerHTML = '';

            if (selectedItems.length === 0) {
                const placeholderRow = document.createElement('tr');
                placeholderRow.id = 'placeholder-row';
                placeholderRow.innerHTML = `
                    <td colspan="6" class="border border-gray-400 p-12 text-center text-gray-400 bg-gray-50 italic">
                        왼쪽 목록에서 항목을 클릭하여 추가하세요.<br>
                        (추가 후 이름과 가격을 클릭하여 수정할 수 있습니다)
                    </td>
                `;
                quoteItemsBody.appendChild(placeholderRow);
                
                subTotalElement.textContent = "0";
                vatAmountElement.textContent = "0";
                tableGrandTotalElement.textContent = "0 원";

            } else {
                let totalSupply = 0;

                selectedItems.forEach((item, index) => {
                    // count나 price가 NaN일 경우 0으로 처리하여 계산 오류 방지
                    const count = isNaN(item.count) ? 0 : item.count;
                    const price = isNaN(item.price) ? 0 : item.price;
                    
                    const supplyPrice = price * count;
                    const tax = Math.round(supplyPrice * 0.1);
                    totalSupply += supplyPrice;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 group transition-colors border-b border-gray-200 last:border-0";
                    tr.innerHTML = `
                        <td class="p-2 text-center text-gray-500 border-r border-gray-300">${index + 1}</td>
                        
                        <!-- 품명 (카테고리 포함) -->
                        <td class="p-2 border-r border-gray-300 relative">
                            <div class="flex items-center">
                                ${item.category ? `<span class="text-[10px] text-indigo-500 bg-indigo-50 px-1 rounded mr-1 whitespace-nowrap no-print">[${item.category}]</span>` : ''}
                                <input type="text" 
                                    value="${item.name}" 
                                    onchange="updateQuoteItem(${index}, 'name', this.value)"
                                    class="w-full bg-transparent font-medium text-gray-800 focus:bg-white focus:ring-1 focus:ring-indigo-500 rounded px-1 outline-none"
                                >
                            </div>
                            <button onclick="removeQuoteItem(${index})" class="no-print absolute right-1 top-1/2 -translate-y-1/2 text-red-300 hover:text-red-600 opacity-0 group-hover:opacity-100 transition p-1">
                                ❌
                            </button>
                        </td>

                        <td class="p-2 text-center border-r border-gray-300">
                            <input type="number" min="1" 
                                value="${item.count}" 
                                onchange="updateQuoteItem(${index}, 'count', this.value)"
                                class="w-16 text-center bg-transparent focus:bg-white focus:ring-1 focus:ring-indigo-500 rounded px-1 outline-none"
                            >
                        </td>

                        <td class="p-2 text-right border-r border-gray-300">
                            <input type="number" 
                                value="${item.price}" 
                                onchange="updateQuoteItem(${index}, 'price', this.value)"
                                class="w-full text-right bg-transparent text-gray-600 focus:bg-white focus:ring-1 focus:ring-indigo-500 rounded px-1 outline-none"
                            >
                        </td>

                        <td class="p-2 text-right font-medium border-r border-gray-300 text-gray-800">
                            ${formatNumber(supplyPrice)}
                        </td>

                        <td class="p-2 text-right text-gray-500 text-xs">
                            ${formatNumber(tax)}
                        </td>
                    `;
                    quoteItemsBody.appendChild(tr);
                });

                const totalTax = Math.round(totalSupply * 0.1);
                const grandTotal = totalSupply + totalTax;

                subTotalElement.textContent = formatNumber(totalSupply);
                vatAmountElement.textContent = formatNumber(totalTax);
                tableGrandTotalElement.textContent = formatNumber(grandTotal) + " 원";
            }
        };

        // 엔터키로 항목 추가
        newItemPriceInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addNewCustomItem();
        });

        const printQuote = () => window.print();
        
        const clearQuote = () => {
            showCustomConfirm("견적서 내용을 초기화하시겠습니까?", (isConfirmed) => {
                if(isConfirmed) {
                    selectedItems = [];
                    displayCustomerName.value = "고객사/담당자";
                    renderQuote();
                }
            });
        };
        
        window.clearQuote = clearQuote;
        window.printQuote = printQuote;

        // 초기화 함수
        const initializeApp = () => {
            initMetaInfo();
            // 로컬 저장소에서 항목을 로드합니다. (데이터가 없으면 CSV 데이터로 초기화)
            loadMasterItemsFromLocal(); 
            // '새 항목 등록' 드롭다운 메뉴를 CATEGORIES 목록에 기반하여 업데이트합니다.
            newItemCategoryInput.innerHTML = '<option value="" disabled selected>대분류 선택</option>';
            CATEGORIES.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                newItemCategoryInput.appendChild(option);
            });

            renderItemCards();
            renderQuote(); // 견적서 초기 렌더링
        };

        window.onload = initializeApp;
    </script>
</body>
</html>
